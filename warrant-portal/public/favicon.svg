<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="QuantGems Warrant Radar">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1a2e"/>
      <stop offset="55%" stop-color="#06121e"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="rim" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="gem" x1="22" y1="16" x2="42" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#00d4ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- plate -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="url(#rim)" stroke-width="1.5" opacity="0.9"/>
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>

  <!-- radar rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#00d4ff" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.1"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="#67e8f9" stroke-opacity="0.4" stroke-width="1.15"/>

  <!-- sweep wedge -->
  <path d="M32 32 L48.5 22.5 A19 19 0 0 1 49.2 36.8 Z" fill="#00d4ff" fill-opacity="0.22"/>
  <path d="M32 32 L48.5 22.5" stroke="#67e8f9" stroke-width="1.4" stroke-linecap="round" opacity="0.95"/>

  <!-- crosshair -->
  <path d="M32 12.5 V19.5 M32 44.5 V51.5 M12.5 32 H19.5 M44.5 32 H51.5" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>

  <!-- black-diamond gem -->
  <g transform="translate(32 32)">
    <polygon points="0,-11 9,-2 0,12 -9,-2" fill="#0f172a" opacity="0.55"/>
    <polygon points="0,-10 8.2,-2.2 0,10.5 -8.2,-2.2" fill="url(#gem)"/>
    <polygon points="0,-10 8.2,-2.2 0,-1.2 -8.2,-2.2" fill="#e0f2fe" opacity="0.55"/>
    <polygon points="0,-1.2 8.2,-2.2 0,10.5" fill="#0284c7" opacity="0.35"/>
    <polygon points="0,-1.2 -8.2,-2.2 0,10.5" fill="#0ea5e9" opacity="0.25"/>
  </g>

  <!-- blip -->
  <circle cx="45.5" cy="24.5" r="2.1" fill="#67e8f9"/>
  <circle cx="45.5" cy="24.5" r="3.6" fill="none" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="1"/>
</svg>
