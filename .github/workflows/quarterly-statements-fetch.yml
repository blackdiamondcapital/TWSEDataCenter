name: Quarterly Financial Statements Fetch

# 三大財務報表（損益／資產負債／現金流量）
# 排程：各季法定申報截止「前五日～後五日」每天台北 00:00
#   Q1 截止 5/15 → 5/10～5/20
#   Q2 截止 8/14 → 8/9～8/19
#   Q3 截止 11/14 → 11/9～11/19
#   Q4 截止次年 3/31 → 3/26～4/5
# GitHub cron 為 UTC：台北 00:00 = UTC 前一日 16:00
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      periods:
        description: '期間（單期 2025Q1、多期 2024Q1,2024Q2 或區間 2024Q1-2024Q4；排程可留空）'
        required: false
        type: string
      statement:
        description: '報表'
        required: true
        default: all
        type: choice
        options:
          - all
          - income
          - balance
          - cashflow
      code_from:
        description: '股票代號起始（選填，例如 2330）'
        required: false
        type: string
      code_to:
        description: '股票代號結束（選填，例如 2899）'
        required: false
        type: string
      pause_every:
        description: '每幾檔休息一次'
        required: true
        default: '60'
        type: string
      pause_minutes:
        description: '每批休息分鐘'
        required: true
        default: '2'
        type: string
      retry_max:
        description: 'MOPS 封鎖重試次數'
        required: true
        default: '8'
        type: string
      retry_wait_minutes:
        description: '封鎖後等待分鐘'
        required: true
        default: '5'
        type: string
      force:
        description: '略過「截止前五日至後五日」窗口檢查（手動強制）'
        required: false
        default: true
        type: boolean

env:
  TZ: Asia/Taipei
  PYTHONUNBUFFERED: '1'

concurrency:
  group: quarterly-statements-${{ github.event_name == 'schedule' && github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      period: ${{ steps.check.outputs.period }}
    steps:
      - name: Check filing-window range
        id: check
        run: |
          python3 <<'PY'
          import os
          from datetime import date, timedelta

          PRE_DAYS = 5
          POST_DAYS = 5

          def deadline(year: int, season: int) -> date:
              if season == 1:
                  return date(year, 5, 15)
              if season == 2:
                  return date(year, 8, 14)
              if season == 3:
                  return date(year, 11, 14)
              return date(year + 1, 3, 31)

          today = date.today()
          print(f"台北日期：{today.isoformat()}")
          candidates = [
              (today.year - 1, 4),
              (today.year, 1),
              (today.year, 2),
              (today.year, 3),
              (today.year, 4),
              (today.year + 1, 1),
          ]
          active = None
          for year, season in candidates:
              filing_deadline = deadline(year, season)
              start = filing_deadline - timedelta(days=PRE_DAYS)
              finish = filing_deadline + timedelta(days=POST_DAYS)
              print(f"  {year}Q{season}: {start}～{finish}（截止 {filing_deadline}）")
              if start <= today <= finish:
                  active = (year, season)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              if active:
                  period = f"{active[0]}Q{active[1]}"
                  print(f"命中窗口：{period}")
                  fh.write("should_run=true\n")
                  fh.write(f"period={period}\n")
              else:
                  print("非截止前五日至後五日窗口，略過")
                  fh.write("should_run=false\n")
                  fh.write("period=\n")
          PY

  scheduled-shards:
    needs: gate
    if: github.event_name == 'schedule' && needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - shard: 0000-2999
            code_from: '0000'
            code_to: '2999'
          - shard: 3000-4999
            code_from: '3000'
            code_to: '4999'
          - shard: 5000-6999
            code_from: '5000'
            code_to: '6999'
          - shard: 7000-9999
            code_from: '7000'
            code_to: '9999'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch scheduled quarterly statements
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          QUARTERLY_STATEMENTS_LOG: quarterly-statements-${{ matrix.shard }}.log
        run: |
          echo "抓取期間：${{ needs.gate.outputs.period }}"
          python scripts/fetch_quarterly_statements_scheduled.py \
            --periods "${{ needs.gate.outputs.period }}" \
            --statement all \
            --code-from "${{ matrix.code_from }}" \
            --code-to "${{ matrix.code_to }}" \
            --delay 0.8 \
            --pause-every 60 \
            --pause-minutes 2 \
            --retry-max 8 \
            --retry-wait-minutes 5 \
            --flush-every 10

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-statements-${{ matrix.shard }}-${{ github.run_number }}
          path: quarterly-statements-${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 30

  scheduled-ratios:
    needs:
      - gate
      - scheduled-shards
    if: github.event_name == 'schedule' && needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard_index: [0, 1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill financial ratios from Neon statements
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python scripts/backfill_financial_ratios.py \
            --from-period "${{ needs.gate.outputs.period }}" \
            --to-period "${{ needs.gate.outputs.period }}" \
            --shard-index "${{ matrix.shard_index }}" \
            --shard-count 4

  manual-fetch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch selected quarterly statements
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          QUARTERLY_STATEMENTS_LOG: quarterly-statements-manual.log
          INPUT_PERIODS: ${{ inputs.periods }}
          INPUT_STATEMENT: ${{ inputs.statement }}
          INPUT_CODE_FROM: ${{ inputs.code_from }}
          INPUT_CODE_TO: ${{ inputs.code_to }}
          INPUT_PAUSE_EVERY: ${{ inputs.pause_every }}
          INPUT_PAUSE_MINUTES: ${{ inputs.pause_minutes }}
          INPUT_RETRY_MAX: ${{ inputs.retry_max }}
          INPUT_RETRY_WAIT_MINUTES: ${{ inputs.retry_wait_minutes }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=(
            --statement "$INPUT_STATEMENT"
            --pause-every "$INPUT_PAUSE_EVERY"
            --pause-minutes "$INPUT_PAUSE_MINUTES"
            --retry-max "$INPUT_RETRY_MAX"
            --retry-wait-minutes "$INPUT_RETRY_WAIT_MINUTES"
            --delay 0.8
            --flush-every 10
          )
          if [ -n "$INPUT_PERIODS" ]; then
            args+=(--periods "$INPUT_PERIODS")
          fi
          if [ -n "$INPUT_CODE_FROM" ]; then
            args+=(--code-from "$INPUT_CODE_FROM")
          fi
          if [ -n "$INPUT_CODE_TO" ]; then
            args+=(--code-to "$INPUT_CODE_TO")
          fi
          if [ "$INPUT_FORCE" != "true" ] && [ -z "$INPUT_PERIODS" ]; then
            args+=(--require-pre-window)
          fi
          python scripts/fetch_quarterly_statements_scheduled.py "${args[@]}"

      - name: Backfill ratios after all three statements
        if: inputs.statement == 'all'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          INPUT_PERIODS: ${{ inputs.periods }}
          INPUT_CODE_FROM: ${{ inputs.code_from }}
          INPUT_CODE_TO: ${{ inputs.code_to }}
        run: |
          mapfile -t ratio_periods < <(
            python - <<'PY'
          import os
          from scripts.fetch_quarterly_statements_scheduled import parse_periods, resolve_quarter

          raw = os.environ.get("INPUT_PERIODS", "").strip()
          periods = parse_periods(raw) if raw else [resolve_quarter()]
          for year, quarter in periods:
              print(f"{year}Q{quarter}")
          PY
          )
          for period in "${ratio_periods[@]}"; do
            args=(--from-period "$period" --to-period "$period")
            if [ -n "$INPUT_CODE_FROM" ]; then
              args+=(--code-from "$INPUT_CODE_FROM")
            fi
            if [ -n "$INPUT_CODE_TO" ]; then
              args+=(--code-to "$INPUT_CODE_TO")
            fi
            python scripts/backfill_financial_ratios.py "${args[@]}"
          done

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-statements-manual-${{ github.run_number }}
          path: quarterly-statements-manual.log
          if-no-files-found: warn
          retention-days: 30
