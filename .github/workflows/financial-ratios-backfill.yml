name: Financial Ratios Backfill

on:
  workflow_dispatch:
    inputs:
      from_period:
        description: '起始季度（例如 2022Q1）'
        required: true
        type: string
      to_period:
        description: '結束季度（例如 2026Q1）'
        required: true
        type: string
      code_from:
        description: '股票代號起點（選填）'
        required: false
        type: string
      code_to:
        description: '股票代號終點（選填）'
        required: false
        type: string
      dry_run:
        description: '只計算、不寫入 Neon'
        required: true
        default: false
        type: boolean

env:
  TZ: Asia/Taipei
  PYTHONUNBUFFERED: '1'

concurrency:
  group: financial-ratios-backfill-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard_index: [0, 1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill TTM financial ratios
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          INPUT_FROM_PERIOD: ${{ inputs.from_period }}
          INPUT_TO_PERIOD: ${{ inputs.to_period }}
          INPUT_CODE_FROM: ${{ inputs.code_from }}
          INPUT_CODE_TO: ${{ inputs.code_to }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(
            --from-period "$INPUT_FROM_PERIOD"
            --to-period "$INPUT_TO_PERIOD"
            --shard-index "${{ matrix.shard_index }}"
            --shard-count 4
          )
          if [ -n "$INPUT_CODE_FROM" ]; then
            args+=(--code-from "$INPUT_CODE_FROM")
          fi
          if [ -n "$INPUT_CODE_TO" ]; then
            args+=(--code-to "$INPUT_CODE_TO")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/backfill_financial_ratios.py "${args[@]}"
