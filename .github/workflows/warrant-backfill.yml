name: Backfill warrant trades (MI_INDEX)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日期 (YYYY-MM-DD)'
        required: true
        default: '2026-02-01'
      end_date:
        description: '結束日期 (YYYY-MM-DD)'
        required: true
        default: '2026-07-31'
      skip_existing:
        description: '略過資料庫已有日期 (true/false)'
        required: false
        default: 'true'
      sleep_seconds:
        description: '每次 MI_INDEX 間隔秒數'
        required: false
        default: '2.5'

concurrency:
  group: warrant-backfill
  cancel-in-progress: false

env:
  TZ: Asia/Taipei

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests

      - name: Backfill warrants
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          ARGS=(
            --start "${{ github.event.inputs.start_date }}"
            --end "${{ github.event.inputs.end_date }}"
            --sleep "${{ github.event.inputs.sleep_seconds }}"
          )
          if [ "${{ github.event.inputs.skip_existing }}" = "true" ]; then
            ARGS+=(--skip-existing)
          fi
          echo "python scripts/backfill_warrants_range.py ${ARGS[*]}"
          python scripts/backfill_warrants_range.py "${ARGS[@]}"
